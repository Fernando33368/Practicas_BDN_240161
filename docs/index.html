<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08091a">
<title>db_test_240161 · Diccionario y diagrama EER</title>
<style>
:root{color-scheme:dark;--bg:#08091a;--panel:#11132a;--line:#34365f;--ink:#ecebff;--cyan:#00e5ff;--pink:#ff43d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}.top{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0;color:var(--cyan)}.tabs{display:flex;gap:8px}.tabs button{padding:9px 14px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:5px;font:inherit;cursor:pointer}.tabs button[aria-selected=true]{border-color:var(--pink);color:var(--pink)}main{height:calc(100dvh - 62px)}iframe{display:none;width:100%;height:100%;border:0;background:#08091a}iframe.active{display:block}@media(max-width:540px){.top{gap:10px;padding:12px}main{height:calc(100dvh - 110px)}.tabs{width:100%}.tabs button{flex:1}}
</style></head><body>
<header class="top"><h1>db_test_240161</h1><nav class="tabs" aria-label="Secciones"><button type="button" id="tab-dic" aria-controls="dic" aria-selected="true">Diccionario de datos</button><button type="button" id="tab-eer" aria-controls="eer" aria-selected="false">Diagrama EER</button></nav></header>
<main><iframe id="dic" class="active" src="diccionario.html" title="Diccionario de datos de db_test_240161"></iframe><iframe id="eer" src="eer.html" title="Diagrama entidad-relación de db_test_240161"></iframe></main>
<script>const tabs=[...document.querySelectorAll('.tabs button')],frames=[...document.querySelectorAll('main iframe')];function show(id){tabs.forEach((tab,i)=>{const active=tab.id==='tab-'+id;tab.setAttribute('aria-selected',String(active));frames[i].classList.toggle('active',active)})}tabs.forEach(tab=>tab.addEventListener('click',()=>show(tab.id.slice(4))));</script>
</body></html>
