const frame=document.getElementById('document');let loaded='';
function show(page){if(loaded!==page){const binary=atob(documents[page]);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));frame.srcdoc=new TextDecoder().decode(bytes);loaded=page}for(const button of document.querySelectorAll('.tab')){const selected=button.dataset.page===page;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1}frame.title=page==='eer'?'Diagrama EER':'Diccionario de datos';document.getElementById('content').setAttribute('aria-labelledby',page==='eer'?'tab-eer':'tab-dictionary');history.replaceState(null,'','#'+page)}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>show(button.dataset.page)));
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){const tabs=[...document.querySelectorAll('.tab')];const current=tabs.indexOf(document.activeElement);if(current!==-1){event.preventDefault();const next=tabs[(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];next.focus();show(next.dataset.page)}}});
show(location.hash==='#eer'?'eer':'dictionary');
